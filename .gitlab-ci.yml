stages:
  - build
  - test

build:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - chmod +x gradlew
    - ./gradlew lwjgl3:classes
  artifacts:
    paths:
      - lwjgl3/build/
      - core/build/

test:
  stage: test
  image: eclipse-temurin:17-jdk
  script:
    - chmod +x gradlew
    - ./gradlew core:test
  artifacts:
    when: always
    reports:
      junit: core/build/test-results/test/**/TEST-*.xml # Displays test results in GitLab UI